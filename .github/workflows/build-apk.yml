name: Build APK and Web

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot (templates + Android editor settings)
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates ~/.config
          if [ "$HOME" != "/root" ]; then
            cp -r /root/.config/godot ~/.config/
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
              ~/.local/share/godot/export_templates/
          fi

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export Android debug APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/coin-dash-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/*.apk

  web:
    name: Web build
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates ~/.config
          if [ "$HOME" != "/root" ]; then
            cp -r /root/.config/godot ~/.config/
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
              ~/.local/share/godot/export_templates/
          fi

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export Web
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
